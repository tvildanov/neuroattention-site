<!doctype html><html lang="ru" data-dom-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOM · Attention Ripple</title>
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;background:#020806;color:#c7f3da;font:14px system-ui;text-align:center}#screen-4{width:min(80vmin,640px);margin:auto}.dom-insight-orb{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:50%}canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}video{display:none}button{margin:8px;padding:9px 15px;border:1px solid #79b897;border-radius:8px;background:#112b20;color:#dff5e9;cursor:pointer}p{opacity:.7}</style>
<main><h1>DOM · Attention Ripple</h1><section id="screen-4" data-attention-view="drop"><div class="dom-insight-orb"><video></video></div><button data-attention-toggle hidden></button></section><button id="theme">Светлая / тёмная</button><button id="png">Сохранить PNG</button><button id="video">Сохранить видео WebM</button><p id="status">Работает без интернета · исходная анимация сохранена в коде</p></main><script>/* Native-resolution attention field; the original 320px video remains a fallback. */
(()=>{'use strict';const root=document.getElementById('screen-4'),orb=root?.querySelector('.dom-insight-orb'),video=orb?.querySelector('video');if(!orb||!video)return;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)return;canvas.className='dom-v04-water';canvas.setAttribute('role','img');canvas.setAttribute('aria-label',({ru:'Капля и расходящиеся волны внимания',en:'A drop and expanding waves of attention',es:'Una gota y ondas de atención en expansión'})[document.documentElement.lang]||'A drop and expanding waves of attention');orb.insertBefore(canvas,video);video.dataset.naNoAutoplay='1';video.pause();video.addEventListener('play',()=>video.pause());video.querySelectorAll('source').forEach(s=>{s.removeAttribute('data-src');s.removeAttribute('src');});video.hidden=true;
const reduced=matchMedia('(prefers-reduced-motion:reduce)'),points=[];for(let r=6;r<=205;r+=6){const count=Math.round(2*Math.PI*r/5.4);for(let i=0;i<count;i++)points.push([r,Math.cos(i/count*Math.PI*2),Math.sin(i/count*Math.PI*2)]);}
let visible=false,frame=0,last=0,epoch=performance.now(),lastPulse=-1;const toggle=root.querySelector('[data-attention-toggle]');
function draw(phase){const box=orb.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,3),size=Math.max(1,Math.round(box.width*dpr));if(canvas.width!==size){canvas.width=size;canvas.height=size;}ctx.setTransform(size/400,0,0,size/400,0,0);ctx.clearRect(0,0,400,400);const light=document.documentElement.dataset.domTheme==='light';ctx.fillStyle=light?'#071b2c':'#020806';ctx.fillRect(0,0,400,400);const hit=phase-2.8;ctx.fillStyle=light?'#c3ddff':'#c7f3da';ctx.beginPath();for(const [r,c,s]of points){const time=hit-r/145;const wave=hit>0?Math.sin(time*12)*Math.exp(-Math.pow(time-.16,2)*3)*10*(1-r/340):0;const perspective=1+s*.24;const x=200+c*r/perspective,y=211+s*r*.48/perspective-wave;const radius=(.43+(s+1)*.24)*(1-r/480);ctx.moveTo(x+radius,y);ctx.arc(x,y,radius,0,Math.PI*2);}ctx.fill();
if(phase<2.8){const y=40+Math.pow(phase/2.8,2)*166;const gradient=ctx.createRadialGradient(199,y-2,.2,200,y,5);gradient.addColorStop(0,'#fff');gradient.addColorStop(.5,light?'#bcdfff':'#dcffe9');gradient.addColorStop(1,'#ffffff00');ctx.fillStyle=gradient;ctx.beginPath();ctx.ellipse(200,y,2.6,6+phase,0,0,Math.PI*2);ctx.fill();}else if(hit<.65){ctx.strokeStyle=light?'#ddedff':'#eefff3';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(196,211);ctx.quadraticCurveTo(200,174+hit*52,204,211);ctx.stroke();}}
function tick(now){frame=0;if(!visible||document.hidden||root.dataset.attentionView!=='drop')return;if(now-last>32){const phase=((now-epoch)/1000)%6.4;draw(reduced.matches?3.7:phase);const cycle=Math.floor((now-epoch)/6400);if(!reduced.matches&&phase>4.2&&phase<4.5&&cycle!==lastPulse){lastPulse=cycle;toggle.classList.remove('is-wave-touched');void toggle.offsetWidth;toggle.classList.add('is-wave-touched');}last=now;}if(!reduced.matches)frame=requestAnimationFrame(tick);}
function refresh(){cancelAnimationFrame(frame);frame=0;if(visible&&!document.hidden&&root.dataset.attentionView==='drop'){draw(3.7);if(!reduced.matches)frame=requestAnimationFrame(tick);}}
new IntersectionObserver(es=>{visible=es[0].isIntersecting;refresh();},{threshold:.08}).observe(orb);new ResizeObserver(()=>{draw(3.7);refresh();}).observe(orb);document.addEventListener('visibilitychange',refresh);document.addEventListener('domattentionviewchange',refresh);document.addEventListener('domthemechange',()=>{draw(3.7);refresh();});reduced.addEventListener('change',refresh);window.DOMV04Media={restart:()=>{epoch=performance.now();last=0;lastPulse=-1;refresh();},inventory:()=>[...document.querySelectorAll('main img,section img,section video')].map(n=>{const r=n.getBoundingClientRect(),style=getComputedStyle(n);return {file:n.currentSrc||n.src||n.querySelector('source')?.src,sourceWidth:n.naturalWidth||n.videoWidth||0,sourceHeight:n.naturalHeight||n.videoHeight||0,cssWidth:r.width,cssHeight:r.height,dpr:devicePixelRatio,fit:style.objectFit,filter:style.filter,transform:style.transform};}),attention:()=>({renderer:'native-canvas',width:canvas.width,cssWidth:canvas.getBoundingClientRect().width,points:points.length,animationRunning:!!frame})};})();
</script>
<script>
const download=(blob,name)=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.domTheme=document.documentElement.dataset.domTheme==='light'?'dark':'light';document.dispatchEvent(new Event('domthemechange'))};
document.getElementById('png').onclick=()=>document.querySelector('canvas').toBlob(blob=>download(blob,'DOM_Attention_Ripple.png'));
document.getElementById('video').onclick=()=>{const c=document.querySelector('canvas'),type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!type)return;const stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:12000000}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{download(new Blob(chunks,{type}),'DOM_Attention_Ripple.webm');stream.getTracks().forEach(t=>t.stop());document.getElementById('status').textContent='Видео сохранено';};DOMV04Media.restart();document.getElementById('status').textContent='Записываем один полный цикл…';rec.start();setTimeout(()=>rec.stop(),6400)};
</script></html>
