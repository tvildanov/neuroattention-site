name: DOM profile texture browser QA
on:
  push:
    branches: [codex/dom-site-refinements]
    paths:
      - 'account.html'
      - 'assets/dom-account-profile.css'
      - 'assets/images/dom-profile-neural-light.webp'
      - 'scripts/check-dom-profile-texture.cjs'
      - '.github/workflows/dom-profile-texture-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /account.html
            /assets/*.css
            /assets/*.svg
            /assets/avatars/stars-default.gif
            /assets/dom-account-profile.css
            /assets/fonts/*.woff2
            /assets/images/dom-profile-neural-light.webp
            /assets/js/**
            /assets/redesign.js
            /assets/scripts.js
            /data/*.json
            /data/css/*.css
            /data/i18n/*.json
            /scripts/check-dom-profile-texture.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix /tmp/dom-profile-qa --no-save playwright@1.56.1 pngjs@7.0.0
      - name: Check release candidate and compatibility with site PR 197
        env:
          NODE_PATH: /tmp/dom-profile-qa/node_modules
        run: |
          node scripts/check-dom-profile-texture.cjs . main
          git fetch --depth=1 --filter=blob:none origin a0eaba7f3872cb306915108a05b5c2dca36fd1ca
          git fetch --depth=1 --filter=blob:none origin refs/pull/197/head
          git worktree add --detach /tmp/dom-pr197 FETCH_HEAD
          git diff a0eaba7f3872cb306915108a05b5c2dca36fd1ca HEAD -- account.html | git -C /tmp/dom-pr197 apply
          mkdir -p /tmp/dom-pr197/assets/images
          cp assets/dom-account-profile.css /tmp/dom-pr197/assets/
          cp assets/images/dom-profile-neural-light.webp /tmp/dom-pr197/assets/images/
          node scripts/check-dom-profile-texture.cjs /tmp/dom-pr197 pr197
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-profile-texture-review
          path: |
            scripts/main-*.png
            scripts/pr197-*.png
          retention-days: 3
