name: Apply DOM v04 source checkpoint
on:
  push:
    branches: ['codex/dom-v04-review-20261117']
    paths: ['.github/patches/dom-v04-backend.patch']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dom-v04-review-20261117
      - run: |
          test "$(git branch --show-current)" = "codex/dom-v04-review-20261117"
          test "$(git hash-object .github/patches/dom-v04-backend.patch)" = "6b0f741446a4f877870119f5b6bcb26a72c6c92d"
          git apply --check .github/patches/dom-v04-backend.patch
          git apply .github/patches/dom-v04-backend.patch
          rm .github/patches/dom-v04-backend.patch
          git add -A
          git -c user.name="DOM release checkpoint" -c user.email="128026364+tvildanov@users.noreply.github.com" commit -m "Preserve v0.4 source, profile build and external feed checkpoint"
          git push origin HEAD:codex/dom-v04-review-20261117
