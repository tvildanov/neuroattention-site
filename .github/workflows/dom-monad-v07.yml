name: DOM account backend integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/services/dom-monad-v07.js'
      - 'scripts/apply-dom-monad-v07.cjs'
      - '.github/workflows/dom-monad-v07.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply DOMunity bridge and validate server
        run: |
          node --check api/services/dom-monad-v07.js
          node scripts/apply-dom-monad-v07.cjs
          node --check api/server.js
      - name: Commit only the validated API integration
        run: |
          git config user.name dom-recovery-bot
          git config user.email dom-recovery-bot@users.noreply.github.com
          git add api/server.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate real DOMunity room agents into existing API'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
