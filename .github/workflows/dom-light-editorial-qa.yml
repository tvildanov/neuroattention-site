name: DOM light editorial browser checks
on:
  push:
    branches: [codex/dom-site-refinements]
    paths:
      - 'assets/dom-site-theme.css'
      - 'scripts/test-dom-light-editorial.cjs'
      - '.github/workflows/dom-light-editorial-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /assets/*.css
            /assets/*.js
            /assets/*.svg
            /assets/logo-na.png
            /assets/fonts/**
            /assets/js/**
            /data/css/*.css
            /data/i18n/*.json
            /scripts/test-dom-inner-v06.cjs
            /scripts/test-dom-light-editorial.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --prefix /tmp/dom-editorial-qa --no-save playwright@1.56.1
      - name: Compare both themes and run existing page checks
        env:
          NODE_PATH: /tmp/dom-editorial-qa/node_modules
        run: |
          git fetch --no-tags --filter=blob:none --depth=1 origin a33a35567ca75c857d9782b3bbc3001dcace456c
          git show FETCH_HEAD:assets/dom-site-theme.css > /tmp/dom-theme-before.css
          node scripts/test-dom-light-editorial.cjs /tmp/dom-theme-before.css
          node scripts/test-dom-inner-v06.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-editorial-style-review
          path: /tmp/dom-editorial-*.png
          retention-days: 3
